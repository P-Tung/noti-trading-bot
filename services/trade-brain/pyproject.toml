[project]
name = "trade-v1-brain"
version = "0.1.0"
description = "Typed contracts and validation for the Trade V1 decision service"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "supabase>=2.0,<3.0",
  "discord.py>=2.5,<3.0",
  "uvicorn[standard]>=0.34,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
